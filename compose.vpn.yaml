# Routes all SelfStream traffic through Surfshark (WireGuard) via Gluetun.
# Usage: docker compose -f compose.yaml -f compose.vpn.yaml up -d --build
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${SELFSTREAM_LOCAL_PORT:-7000}:7000"
    environment:
      VPN_SERVICE_PROVIDER: surfshark
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${SURFSHARK_WIREGUARD_PRIVATE_KEY:?set SURFSHARK_WIREGUARD_PRIVATE_KEY in .env}
      WIREGUARD_ADDRESSES: ${SURFSHARK_WIREGUARD_ADDRESSES:-10.14.0.2/16}
      # 1280 leaves headroom for 4G/CGNAT encapsulation and avoids fragmentation stalls.
      WIREGUARD_MTU: ${SURFSHARK_WIREGUARD_MTU:-1280}
      SERVER_COUNTRIES: ${SURFSHARK_SERVER_COUNTRIES:-}
      SERVER_CITIES: ${SURFSHARK_SERVER_CITIES:-}
      TZ: ${TZ:-UTC}

  selfstream:
    # The app shares Gluetun's network namespace, so the port is published on gluetun.
    network_mode: "service:gluetun"
    ports: !reset []
    depends_on:
      gluetun:
        condition: service_healthy
